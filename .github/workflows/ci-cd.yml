name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run E2E Tests
        run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.image.outputs.repo }}
      image_tag: ${{ steps.image.outputs.tag }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: |
          USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          REPO="$USERNAME/shopping-cart-ee"
          TAG="${{ github.sha }}"
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=$REPO:$TAG" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t ${{ steps.image.outputs.image }} -t ${{ steps.image.outputs.repo }}:latest .

      - name: Push Image
        run: |
          docker push ${{ steps.image.outputs.image }}
          docker push ${{ steps.image.outputs.repo }}:latest

  deploy:
    runs-on: self-hosted
    needs: build

    env:
      IMAGE_REPO: ${{ needs.build.outputs.image_repo }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      IMAGE: ${{ needs.build.outputs.image }}
      KUBECONFIG_PATH: ~/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Deploy kubernetes using docker desktop ---
      - name: Deploy using k8's
        run: |
          # Reconstruct full image name here in case job outputs were empty
          USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE="$USERNAME/shopping-cart-ee:$IMAGE_TAG"
          echo "Deploying image: $FULL_IMAGE"
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          # Update the container image to the exact SHA tag so Kubernetes always detects a change
          kubectl set image deployment/shopping-cart shopping-cart=$FULL_IMAGE
          kubectl rollout status deployment/shopping-cart
