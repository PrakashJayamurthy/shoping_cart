name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run E2E Tests
        run: npm run test:e2e

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t prakash061994/shopping-cart-ee:latest .

      - name: Push Image
        run: docker push prakash061994/shopping-cart-ee:latest

  deploy:
    runs-on: self-hosted
    needs: build-test

    env:
      IMAGE_TAG: ${{ github.sha }}
      KUBECONFIG_PATH: ~/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lowercase repo name
        id: repo
        run: |
          USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$USERNAME/shopping-cart-ee" >> $GITHUB_OUTPUT

      # --- Deploy kubernetes using docker desktop ---
      - name: Deploy using k8's
        run: kubectl apply -f k8s/deployment.yml && kubectl apply -f k8s/service.yml
