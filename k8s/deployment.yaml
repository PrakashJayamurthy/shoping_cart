apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      containers:
        - name: shopping-cart
          image: prakash061994/shopping-cart-ee:latest   # replaced at deploy time by CI with the exact SHA tag
          imagePullPolicy: Always
          ports:
            - containerPort: 80
